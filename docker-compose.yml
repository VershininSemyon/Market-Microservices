
services:
  auth-backend:
    build:
      context: ./backend/auth-service
      dockerfile: dockerfile
    container_name: auth-backend
    restart: always
    env_file:
      - .env
    expose:
      - "8001"
    networks:
      - app_net
    depends_on:
      auth-postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    
  products-backend:
    build:
      context: ./backend/products-service
      dockerfile: dockerfile
    container_name: products-backend
    restart: always
    env_file:
      - .env
    expose:
      - "8002"
    networks:
      - app_net
    depends_on:
      products-postgres:
        condition: service_healthy
      

  api-gateway:
    image: nginx:1.27-alpine
    container_name: api-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - auth-backend
    networks:
      - app_net

  auth-postgres:
    image: postgres:17-alpine
    container_name: auth-postgres
    restart: always
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${AUTH_SERVICE_POSTGRES_DB_NAME}
      POSTGRES_USER: ${AUTH_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_SERVICE_POSTGRES_PASSWORD}
    networks:
      - app_net
    ports:
      - "${AUTH_SERVICE_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_SERVICE_POSTGRES_USER} -d ${AUTH_SERVICE_POSTGRES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  products-postgres:
    image: postgres:17-alpine
    container_name: products-postgres
    restart: always
    volumes:
      - products-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PRODUCTS_SERVICE_POSTGRES_DB_NAME}
      POSTGRES_USER: ${PRODUCTS_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PRODUCTS_SERVICE_POSTGRES_PASSWORD}
    networks:
      - app_net
    ports:
      - "${PRODUCTS_SERVICE_POSTGRES_EXTERNAL_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCTS_SERVICE_POSTGRES_USER} -d ${PRODUCTS_SERVICE_POSTGRES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4.8.1
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - app_net
    depends_on:
      auth-postgres:
        condition: service_healthy

  redis_monitoring:
    image: redis/redisinsight:3.0.3
    container_name: redis_monitoring
    restart: always
    ports:
      - "5540:5540"
    networks:
      - app_net

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - app_net
    depends_on:
      - auth-backend
      - products-backend

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: always
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    networks:
      - app_net
    depends_on:
      - prometheus

  elasticsearch:
    image: elasticsearch:8.12.2
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.12.0
    container_name: es-dashboards
    restart: always
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://elasticsearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - app_net
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  auth-postgres-data:
  products-postgres-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:

networks:
  app_net:
    driver: bridge
