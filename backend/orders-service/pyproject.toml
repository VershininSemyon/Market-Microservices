
[project]
name = "orders-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "faststream>=0.7.8",
    "greenlet>=3.5.6",
    "mypy>=2.4.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "ruff>=0.17.2",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 120
exclude = [".venv", "venv", ".env", "env", "alembic", "migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
fixable = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
exclude = [".venv", "venv", ".env", "env", "alembic", "migrations"]
