
[project]
name = "products-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "elasticsearch[async]>=8.12.0,<9.0.0",
    "fastapi>=0.141.1",
    "mypy>=2.3.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "redis>=8.1.0",
    "ruff>=0.16.4",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[tool.ruff]
line-length = 120
exclude = [".venv", "venv", ".env", "env", "alembic", "migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
fixable = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
exclude = [".venv", "venv", ".env", "env", "alembic", "migrations"]
